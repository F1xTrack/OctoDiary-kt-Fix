# Project-wide Gradle settings.

# Performance Optimizations
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# JVM arguments: Increased to 4GB and optimized GC
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Android settings
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin settings
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.java=true
# kotlin.compiler.execution.strategy=in-process # Daemon is usually faster

# Kapt / Annotation Processing optimizations
kapt.use.worker.api=true
kapt.incremental.apt=true

